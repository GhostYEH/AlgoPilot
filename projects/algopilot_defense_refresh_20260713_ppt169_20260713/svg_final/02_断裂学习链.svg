<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#071521"/>
  <g id="blueprint-grid" data-pptx-role="decoration" opacity="0.55">
    <path d="M56 216H1224 M56 296H1224 M56 376H1224 M56 456H1224 M56 536H1224 M160 196V576 M320 196V576 M480 196V576 M640 196V576 M800 196V576 M960 196V576 M1120 196V576" fill="none" stroke="#163246" stroke-width="1"/>
