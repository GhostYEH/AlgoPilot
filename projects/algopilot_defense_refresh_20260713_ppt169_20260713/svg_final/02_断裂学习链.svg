  </g>
  <g id="core-message">
    <text x="56" y="196" font-family="Noto Sans SC, Segoe UI, sans-serif" font-size="32" fill="#A9C2D3">不是缺少工具，而是概念、练习、诊断、记忆与教学反馈没有接成一条链。</text>
  </g>
  <g id="broken-chain">
