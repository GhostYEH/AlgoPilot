    </g>
    <g transform="translate(275, 145)">
      <rect x="0" y="0" width="240" height="65" rx="4" fill="#E8F0FE"/>
      <text x="10" y="22" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">📈 学习事件追踪</text>
      <text x="10" y="44" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">学习行为记录与分析</text>
      <text x="10" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">7 表外键关联数据</text>
