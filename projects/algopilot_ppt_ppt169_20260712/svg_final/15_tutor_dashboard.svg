      <text x="10" y="44" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">错误代码自动分析</text>
      <text x="10" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">Trace 可视化回放</text>
