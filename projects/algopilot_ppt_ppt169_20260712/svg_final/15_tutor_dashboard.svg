      <text x="10" y="44" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">逐个查看学生薄弱点</text>
      <text x="10" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">针对性辅导参考</text>
