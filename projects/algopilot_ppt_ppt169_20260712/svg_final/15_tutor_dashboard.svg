      <text x="10" y="22" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">📊 OJ 学情分析</text>
      <text x="10" y="44" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">全班 OJ 完成情况统计</text>
