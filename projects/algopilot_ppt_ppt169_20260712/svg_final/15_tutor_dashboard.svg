  <!-- Bottom highlight -->
  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="1120" height="44" rx="6" fill="none" stroke="#2D7DD2" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="560" y="27" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">✦ AiTutorAgent + TeacherDashboardAgent + MasteryEvalAgent + LearningEventAgent  四引擎驱动</text>
