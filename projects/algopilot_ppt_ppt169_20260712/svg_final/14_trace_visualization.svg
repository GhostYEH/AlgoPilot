<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">04 · CORE FEATURES</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">代码 Trace 可视化——看见每一步</text>
  <line x1="80" y1="100" x2="450" y2="100" stroke="#2D7DD2" stroke-width="2"/>
  <!-- Python Trace -->
  <g transform="translate(80, 135)">
    <rect x="0" y="0" width="540" height="260" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="35" rx="6" fill="#1B2A4A"/>
    <text x="20" y="23" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF">🐍 Python Trace：sys.settrace</text>
    <g transform="translate(20, 55)">
      <line x1="0" y1="5" x2="240" y2="5" stroke="#2D7DD2" stroke-width="1"/>
      <text x="0" y="20" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">Step 5</text>
      <rect x="0" y="30" width="120" height="55" rx="4" fill="#EDF0F5"/>
      <text x="10" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">变量追踪</text>
      <text x="10" y="65" font-family="'Inter', monospace" font-weight="400" font-size="11" fill="#2D7DD2">curr → Node(3)</text>
      <line x1="120" y1="42" x2="140" y2="42" stroke="#2D7DD2" stroke-width="1"/>
      <polygon points="140,42 134,38 134,46" fill="#2D7DD2"/>
      <text x="145" y="20" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">Step 6</text>
      <rect x="140" y="30" width="120" height="55" rx="4" fill="#EDF0F5"/>
      <text x="150" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">调用栈</text>
      <text x="150" y="65" font-family="'Inter', monospace" font-weight="400" font-size="11" fill="#6B7280">reverse_list</text>
      <line x1="260" y1="42" x2="280" y2="42" stroke="#2D7DD2" stroke-width="1"/>
      <polygon points="280,42 274,38 274,46" fill="#2D7DD2"/>
      <text x="285" y="20" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">Step 7</text>
      <rect x="280" y="30" width="140" height="55" rx="4" fill="#EDF0F5"/>
      <text x="290" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">内存状态</text>
      <text x="290" y="65" font-family="'Inter', monospace" font-weight="400" font-size="11" fill="#6B7280">head▸1▸2▸3▸None</text>
    </g>
  </g>
  <!-- C++ Trace -->
  <g transform="translate(650, 135)">
    <rect x="0" y="0" width="540" height="260" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="35" rx="6" fill="#2D7DD2"/>
    <text x="20" y="23" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF">⚡ C++ Trace：GDB MI</text>
    <g transform="translate(20, 55)">
      <line x1="0" y1="5" x2="240" y2="5" stroke="#1B2A4A" stroke-width="1"/>
      <rect x="0" y="30" width="140" height="55" rx="4" fill="#E8F0FE"/>
      <text x="10" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">GDB 单步追踪</text>
      <text x="10" y="65" font-family="'Inter', monospace" font-weight="400" font-size="11" fill="#6B7280">→ line 42: curr = curr-&gt;next</text>
      <rect x="160" y="30" width="150" height="55" rx="4" fill="#E8F0FE"/>
      <text x="170" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">STL 容器提取</text>
      <text x="170" y="65" font-family="'Inter', monospace" font-weight="400" font-size="11" fill="#6B7280">gdb_stl_extract</text>
    </g>
  </g>
  <!-- 13 Types -->
  <g transform="translate(80, 420)">
    <text x="0" y="0" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">13 种 Trace 可视化类型</text>
    <line x1="0" y1="14" x2="200" y2="14" stroke="#2D7DD2" stroke-width="2"/>
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="10" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">变量追踪</text>
      <rect x="142" y="0" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="152" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">调用栈</text>
      <rect x="284" y="0" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="294" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">内存状态</text>
      <rect x="426" y="0" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="436" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">链表结构</text>
      <rect x="568" y="0" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="578" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">树/图</text>
      <rect x="710" y="0" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="720" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">数组</text>
      <rect x="0" y="34" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="10" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">指针引用</text>
      <rect x="142" y="34" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="152" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">递归展开</text>
      <rect x="284" y="34" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="294" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">循环展开</text>
      <rect x="426" y="34" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="436" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">条件分支</text>
      <rect x="568" y="34" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="578" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">时间线</text>
      <rect x="710" y="34" width="130" height="28" rx="4" fill="#EDF0F5"/><text x="720" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">旁白</text>
    </g>
  </g>
  <g transform="translate(80, 530)">
    <rect x="0" y="0" width="1120" height="44" rx="6" fill="#EDF0F5"/>
    <text x="20" y="27" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">✦ Python sys.settrace + C++ GDB MI 统一为 13 类可视化类型 · 确定性旁白确保经典题目可复现</text>
  </g>
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">14 / 24</text>
</svg>
