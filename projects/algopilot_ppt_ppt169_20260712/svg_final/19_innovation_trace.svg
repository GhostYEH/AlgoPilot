<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">06 · INNOVATION</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">Python/C++ Trace 协议统一归一化</text>
  <line x1="80" y1="100" x2="500" y2="100" stroke="#2D7DD2" stroke-width="2"/>
  <!-- Two language paths -->
  <g transform="translate(80, 140)">
    <!-- Python Path -->
    <rect x="0" y="0" width="500" height="300" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="500" height="40" rx="6" fill="#1B2A4A"/>
    <text x="20" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF">🐍 Python Trace 路径</text>
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="140" height="45" rx="4" fill="#EDF0F5"/>
      <text x="70" y="20" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">Python</text>
      <text x="70" y="36" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">sys.settrace HOOK</text>
      <line x1="140" y1="22" x2="165" y2="22" stroke="#1B2A4A" stroke-width="1.5"/>
      <polygon points="165,22 158,18 158,27" fill="#1B2A4A"/>
      <rect x="165" y="0" width="120" height="45" rx="4" fill="#E8F0FE"/>
      <text x="225" y="20" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">统一事件流</text>
      <text x="225" y="36" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">Normalized Events</text>
    </g>
  </g>
  <g transform="translate(80, 230)">
    <!-- C++ Path -->
    <rect x="0" y="0" width="500" height="210" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="500" height="40" rx="6" fill="#2D7DD2"/>
    <text x="20" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF">⚡ C++ Trace 路径</text>
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="140" height="45" rx="4" fill="#EDF0F5"/>
      <text x="70" y="20" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">C++ (GDB)</text>
      <text x="70" y="36" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">GDB MI 单步</text>
      <line x1="140" y1="22" x2="165" y2="22" stroke="#1B2A4A" stroke-width="1.5"/>
      <polygon points="165,22 158,18 158,27" fill="#1B2A4A"/>
      <rect x="165" y="0" width="130" height="45" rx="4" fill="#E8F0FE"/>
      <text x="230" y="20" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">STL 容器提取</text>
      <text x="230" y="36" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">gdb_stl_extract</text>
      <line x1="295" y1="22" x2="320" y2="22" stroke="#1B2A4A" stroke-width="1.5"/>
      <polygon points="320,22 313,18 313,27" fill="#1B2A4A"/>
      <rect x="320" y="0" width="120" height="45" rx="4" fill="#E8F0FE"/>
      <text x="380" y="20" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">统一事件流</text>
      <text x="380" y="36" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">Normalized Events</text>
    </g>
  </g>
  <!-- Right: Unified output -->
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="540" height="300" rx="6" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1.5"/>
    <rect x="0" y="0" width="540" height="40" rx="6" fill="#2D7DD2"/>
    <text x="20" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF">🎯 统一输出：13 类可视化类型</text>
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="10" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">变量追踪</text>
      <rect x="250" y="0" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="260" y="19" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">调用栈</text>
      <rect x="0" y="34" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="10" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">内存状态</text>
      <rect x="250" y="34" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="260" y="53" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">链表结构</text>
      <rect x="0" y="68" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="10" y="87" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">树/图遍历</text>
      <rect x="250" y="68" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="260" y="87" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">数组操作</text>
      <rect x="0" y="102" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="10" y="121" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">指针引用</text>
      <rect x="250" y="102" width="240" height="28" rx="4" fill="#EDF0F5"/><text x="260" y="121" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#1E2024">递归展开</text>
    </g>
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="500" height="36" rx="6" fill="#E8F0FE"/>
      <text x="250" y="23" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#1B2A4A" text-anchor="middle">D3.js 13 个可视化组件前端渲染</text>
    </g>
  </g>
  <!-- Bottom: Deterministic narration -->
  <g transform="translate(620, 460)">
    <rect x="0" y="0" width="540" height="80" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="#10B981"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">✦</text>
    <text x="48" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">确定性旁白</text>
    <text x="48" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">经典题目（反转链表、unique-paths）无 LLM 依赖</text>
    <text x="48" y="73" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">确保可复现、可验证的旁白内容</text>
  </g>
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">19 / 24</text>
</svg>
