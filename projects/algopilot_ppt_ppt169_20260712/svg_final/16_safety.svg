    <circle cx="0" cy="0" r="80" fill="none" stroke="#2D7DD2" stroke-width="2.5"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="40" fill="#2D7DD2"/>
    <text x="0" y="5" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">安全</text>
    <!-- Ring 1 label -->
    <g transform="translate(0, -50)">
      <text x="0" y="0" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#2D7DD2" text-anchor="middle">第一层</text>
    </g>
    <!-- Ring 2 label -->
