      <text x="0" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">幻觉题号识别</text>
      <text x="0" y="71" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Prompt 注入防护</text>
