<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">05 · SAFETY &amp; INNOVATION</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">如何让 AI 不说胡话？三重防幻觉防线</text>
  <line x1="80" y1="100" x2="550" y2="100" stroke="#2D7DD2" stroke-width="2"/>
  <!-- Three concentric defense rings -->
  <g transform="translate(640, 400)">
