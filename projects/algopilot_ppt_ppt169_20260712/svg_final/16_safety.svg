      <text x="0" y="202" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">C++ 安全拦截</text>
      <text x="0" y="227" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">check_cpp_security</text>
      <text x="0" y="250" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">system/fork/exec 拦截</text>
