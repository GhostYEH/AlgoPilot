      <text x="0" y="112" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">内容输出安全</text>
      <text x="0" y="137" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">输出内容截断保护</text>
