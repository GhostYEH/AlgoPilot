      <text x="0" y="207" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Pydantic Schema 验证</text>
      <text x="0" y="230" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">格式/类型自动校验</text>
    </g>
  </g>
  <g transform="translate(820, 140)">
