<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <clipPath id="diagonal-clip">
      <polygon points="0,430 1280,310 1280,720 0,720"/>
    </clipPath>
    <clipPath id="node-clip">
      <rect x="0" y="0" width="1280" height="430"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>

  <!-- Upper section: decorative geometric nodes -->
  <g clip-path="url(#node-clip)" opacity="0.08">
    <!-- Abstract interconnected nodes -->
    <circle cx="180" cy="120" r="4" fill="#1B2A4A"/>
    <circle cx="320" cy="80" r="6" fill="#1B2A4A"/>
    <circle cx="500" cy="150" r="3" fill="#1B2A4A"/>
    <circle cx="650" cy="70" r="5" fill="#1B2A4A"/>
    <circle cx="800" cy="130" r="4" fill="#1B2A4A"/>
    <circle cx="950" cy="60" r="6" fill="#1B2A4A"/>
    <circle cx="1100" cy="140" r="3" fill="#1B2A4A"/>
    <circle cx="280" cy="200" r="3" fill="#1B2A4A"/>
    <circle cx="450" cy="250" r="4" fill="#1B2A4A"/>
    <circle cx="700" cy="220" r="5" fill="#1B2A4A"/>
    <circle cx="900" cy="280" r="3" fill="#1B2A4A"/>
    <circle cx="1050" cy="200" r="4" fill="#1B2A4A"/>
    <!-- Connecting lines -->
    <line x1="180" y1="120" x2="320" y2="80" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="320" y1="80" x2="500" y2="150" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="320" y1="80" x2="650" y2="70" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="650" y1="70" x2="800" y2="130" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="650" y1="70" x2="950" y2="60" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="800" y1="130" x2="1100" y2="140" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="500" y1="150" x2="280" y2="200" stroke="#1B2A4A" stroke-width="1"/>
    <line x1="500" y1="150" x2="450" y2="250" stroke="#1B2A4A" stroke-width="1"/>
    <line x1="800" y1="130" x2="700" y2="220" stroke="#1B2A4A" stroke-width="1"/>
    <line x1="950" y1="60" x2="1050" y2="200" stroke="#1B2A4A" stroke-width="1"/>
    <line x1="700" y1="220" x2="900" y2="280" stroke="#1B2A4A" stroke-width="1"/>
    <line x1="450" y1="250" x2="900" y2="280" stroke="#1B2A4A" stroke-width="1"/>
  </g>

  <!-- Diagonal navy block (lower 40%) -->
  <polygon points="0,430 1280,310 1280,720 0,720" fill="#1B2A4A"/>

  <!-- Accent line separating sections -->
  <line x1="0" y1="428" x2="1280" y2="308" stroke="#2D7DD2" stroke-width="3"/>

  <!-- Small accent decorative element -->
  <rect x="80" y="355" width="40" height="3" rx="1.5" fill="#2D7DD2"/>

  <!-- Title on navy block -->
  <text x="80" y="480" font-family="'Inter', 'Source Han Sans SC', sans-serif" font-weight="700" font-size="52" fill="#FFFFFF">AlgoPilot</text>
  <text x="80" y="545" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="700" font-size="52" fill="#FFFFFF">算法领航员</text>

  <!-- Subtitle -->
  <text x="80" y="595" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="22" fill="#9CA3AF">面向《数据结构与算法》的多智能体智能学习平台</text>

  <!-- Accent dot next to subtitle -->
  <circle cx="68" cy="590" r="3" fill="#2D7DD2"/>

  <!-- Bottom info bar -->
  <text x="1050" y="680" font-family="'Inter', 'Source Han Sans SC', sans-serif" font-weight="400" font-size="14" fill="#9CA3AF" text-anchor="end">软件杯 A3 赛题 · 2026</text>
</svg>
