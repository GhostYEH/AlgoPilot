<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>

  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">02 · SOLUTION</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">从"不会"到"掌握"的智能闭环</text>
  <line x1="80" y1="100" x2="400" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- Circular learning loop -->
  <g transform="translate(640, 380)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Connection arrows (arcs) -->
    <!-- Step 1→2 -->
    <path d="M 0,-200 A 200,200 0 0,1 200,0" fill="none" stroke="#1B2A4A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="85" y="-155" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#1B2A4A">→</text>
    <!-- Step 2→3 -->
    <text x="115" y="-10" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#1B2A4A">→</text>
    <!-- Step 3→4 -->
    <text x="10" y="115" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#1B2A4A">→</text>
    <!-- Step 4→5 -->
    <text x="-115" y="-10" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#1B2A4A">→</text>
    <!-- Step 5→6 -->
    <text x="-155" y="-85" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#1B2A4A">→</text>

    <!-- Connection lines between nodes -->
    <line x1="140" y1="-140" x2="173" y2="-100" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="173" y1="100" x2="140" y2="140" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="0" y1="173" x2="0" y2="140" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="-173" y1="100" x2="-140" y2="140" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="-173" y1="-100" x2="-140" y2="-140" stroke="#1B2A4A" stroke-width="1.5"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="50" fill="#1B2A4A"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">闭环</text>

    <!-- Step 1: Profile -->
    <g transform="translate(0, -250)">
      <circle cx="0" cy="0" r="40" fill="#EDF0F5" stroke="#1B2A4A" stroke-width="2"/>
      <text x="0" y="-12" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">学生</text>
      <text x="0" y="8" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">画像</text>
    </g>
    <!-- Step 2: Path -->
    <g transform="translate(250, 0)">
      <circle cx="0" cy="0" r="40" fill="#EDF0F5" stroke="#1B2A4A" stroke-width="2"/>
      <text x="0" y="-12" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">学习</text>
      <text x="0" y="8" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">路径</text>
    </g>
    <!-- Step 3: Resources -->
    <g transform="translate(0, 250)">
      <circle cx="0" cy="0" r="40" fill="#EDF0F5" stroke="#1B2A4A" stroke-width="2"/>
      <text x="0" y="-12" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">资源</text>
      <text x="0" y="8" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">生成</text>
    </g>
    <!-- Step 4: OJ+Trace -->
    <g transform="translate(-250, 0)">
      <circle cx="0" cy="0" r="40" fill="#EDF0F5" stroke="#1B2A4A" stroke-width="2"/>
      <text x="0" y="-12" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">OJ与</text>
      <text x="0" y="8" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">Trace</text>
    </g>
  </g>

  <!-- Side label: Step 5+6 -->
  <g transform="translate(880, 280)">
    <rect x="0" y="0" width="200" height="100" rx="6" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1.5"/>
    <text x="100" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">掌握度评估</text>
    <text x="100" y="52" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A" text-anchor="middle">→ 路径动态调整</text>
    <line x1="20" y1="65" x2="180" y2="65" stroke="#D1D5DB" stroke-width="1"/>
    <text x="100" y="84" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">持续迭代 · 动态优化</text>
  </g>

  <!-- Connecting arrow from loop to side -->
  <line x1="430" y1="380" x2="870" y2="330" stroke="#2D7DD2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="870,330 862,325 862,335" fill="#2D7DD2"/>

  <!-- Page number -->
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">06 / 24</text>
</svg>
