<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="p1-bg"><rect x="760" y="60" width="460" height="600" rx="8" fill="#EDF0F5"/></filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>

  <!-- Section tag -->
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">01 · BACKGROUND</text>

  <!-- Page Title -->
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">每个算法学习者都懂的五道坎</text>
  <line x1="80" y1="100" x2="350" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- Pain Point Cards -->
  <!-- P1 -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#EF4444"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">P1</text>
    <text x="44" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">概念抽象难懂</text>
    <text x="16" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">树、图、动态规划高度抽象</text>
    <text x="16" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">课本静态插图难以展示动态过程</text>
  </g>

  <!-- P2 -->
  <g transform="translate(450, 140)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#EF4444"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">P2</text>
    <text x="44" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">刷题盲目无方向</text>
    <text x="16" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">不知先学什么、后学什么</text>
    <text x="16" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">题海茫茫缺乏个性化路径</text>
  </g>

  <!-- P3 -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#EF4444"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">P3</text>
    <text x="44" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">错题不知为何错</text>
    <text x="16" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">OJ只返回WA/TLE冰冷判定</text>
    <text x="16" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">看不到程序运行轨迹</text>
  </g>

  <!-- P4 -->
  <g transform="translate(450, 250)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#EF4444"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">P4</text>
    <text x="44" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">学习过程无记录</text>
    <text x="16" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">学过的内容散落各处</text>
    <text x="16" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">换设备一切归零</text>
  </g>

  <!-- P5 -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#EF4444"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">P5</text>
    <text x="44" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">教师难以因材施教</text>
    <text x="16" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">大班授课无法掌握个体差异</text>
    <text x="16" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">作业批改与学情分析靠人工</text>
  </g>

  <!-- Callout -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="710" height="44" rx="6" fill="#EDF0F5"/>
    <text x="20" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="15" fill="#6B7280">✦ 公认"最难啃的硬骨头" — 各大高校计算机专业课程调研</text>
  </g>

  <!-- Right decorative panel: quote -->
  <g transform="translate(840, 160)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="700" font-size="64" fill="#2D7DD2" opacity="0.15">"</text>
    <text x="10" y="90" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="15" fill="#6B7280" line-height="1.6">数据结构与算法是</text>
    <text x="10" y="115" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="15" fill="#6B7280">计算机类专业</text>
    <text x="10" y="140" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="15" fill="#6B7280">基础核心课"</text>
    <text x="10" y="175" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF">— 计算机教育调研</text>
  </g>

  <!-- Page number -->
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">03 / 24</text>
</svg>
