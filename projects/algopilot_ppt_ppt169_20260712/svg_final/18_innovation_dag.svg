<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">06 · INNOVATION</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">零依赖的自研 DAG 编排引擎</text>
  <line x1="80" y1="100" x2="450" y2="100" stroke="#2D7DD2" stroke-width="2"/>
  <!-- Main content -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="640" height="400" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="640" height="40" rx="6" fill="#1B2A4A"/>
    <text x="20" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF">自研编排器架构图</text>
    <g transform="translate(40, 70)">
      <!-- Flow diagram -->
      <rect x="0" y="0" width="120" height="40" rx="4" fill="#1B2A4A"/>
      <text x="60" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">Pipeline</text>
      <line x1="120" y1="20" x2="150" y2="20" stroke="#1B2A4A" stroke-width="1.5"/>
      <polygon points="150,20 142,15 142,25" fill="#1B2A4A"/>
      <rect x="150" y="0" width="120" height="40" rx="4" fill="#2D7DD2"/>
      <text x="210" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">资源调度</text>
      <line x1="270" y1="20" x2="300" y2="20" stroke="#2D7DD2" stroke-width="1.5"/>
      <polygon points="300,20 292,15 292,25" fill="#2D7DD2"/>
      <rect x="300" y="0" width="140" height="40" rx="4" fill="#1B2A4A"/>
      <text x="370" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">并行执行器</text>
    </g>
    <!-- Branch diagram -->
    <g transform="translate(80, 140)">
      <line x1="60" y1="0" x2="60" y2="30" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="20" y1="30" x2="100" y2="30" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="20" y1="30" x2="20" y2="50" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="100" y1="30" x2="100" y2="50" stroke="#D1D5DB" stroke-width="1.5"/>
      <rect x="0" y="50" width="40" height="55" rx="4" fill="#EDF0F5" stroke="#D1D5DB" stroke-width="1"/>
      <text x="20" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">串行</text>
      <text x="20" y="88" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">节点</text>
      <rect x="80" y="50" width="40" height="55" rx="4" fill="#EDF0F5" stroke="#D1D5DB" stroke-width="1"/>
      <text x="100" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">串行</text>
      <text x="100" y="88" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">节点</text>
      <!-- Merge -->
      <line x1="20" y1="105" x2="20" y2="125" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="100" y1="105" x2="100" y2="125" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="20" y1="125" x2="100" y2="125" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="60" y1="125" x2="60" y2="145" stroke="#D1D5DB" stroke-width="1.5"/>
      <rect x="35" y="145" width="50" height="30" rx="15" fill="#10B981"/>
      <text x="60" y="164" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle">Done</text>
    </g>
    <g transform="translate(40, 310)">
      <rect x="0" y="0" width="560" height="36" rx="6" fill="#EDF0F5"/>
      <text x="280" y="23" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280" text-anchor="middle">支持串行 / 并行 / 条件分支拓扑 · 188 测试验证编排正确性</text>
    </g>
  </g>
  <!-- Right: Key points -->
  <g transform="translate(760, 140)">
    <rect x="0" y="0" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="20" cy="20" r="12" fill="#2D7DD2"/>
    <text x="20" y="25" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">✦</text>
    <text x="44" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">零 langgraph 依赖</text>
    <text x="20" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">借鉴状态图与 DAG 编排思想，自主实现</text>
    <text x="20" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">不依赖任何第三方 Agent 框架</text>
    <text x="20" y="98" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">部署简单，无额外运行时依赖</text>
  </g>
  <g transform="translate(760, 270)">
    <rect x="0" y="0" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="20" cy="20" r="12" fill="#1B2A4A"/>
    <text x="20" y="25" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">✦</text>
    <text x="44" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">灵活拓扑编排</text>
    <text x="20" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">DAG 拓扑定义 Agent 依赖关系</text>
    <text x="20" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">四阶段并行资源生成</text>
    <text x="20" y="98" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">任务级调度精确到每个 Agent</text>
  </g>
  <g transform="translate(760, 400)">
    <rect x="0" y="0" width="420" height="110" rx="6" fill="#E8F0FE" stroke="#2D7DD2" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#2D7DD2"/>
    <text x="20" y="25" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">✦</text>
    <text x="44" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">188 测试通过</text>
    <text x="20" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">涵盖编排器核心逻辑</text>
    <text x="20" y="78" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Agent 调用链路测试</text>
    <text x="20" y="98" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">端到端流程验证</text>
  </g>
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">18 / 24</text>
</svg>
