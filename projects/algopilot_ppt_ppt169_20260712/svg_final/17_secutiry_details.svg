<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">05 · SAFETY &amp; INNOVATION</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">从代码到内容，层层设防</text>
  <line x1="80" y1="100" x2="400" y2="100" stroke="#2D7DD2" stroke-width="2"/>
  <!-- 6 Security Cards in 3x2 -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#1B2A4A"/>
    <text x="24" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🔍 AST 静态审计</text>
    <text x="24" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">ASTAnalyzerAgent</text>
    <text x="24" y="75" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">识别死循环、数组越界</text>
    <text x="24" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">执行前熔断，防止资源耗尽</text>
  </g>
  <g transform="translate(450, 140)">
    <rect x="0" y="0" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#2D7DD2"/>
    <text x="24" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🛡️ C++ 安全拦截</text>
    <text x="24" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">check_cpp_security 正则</text>
    <text x="24" y="75" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">拦截 system() / fork() / exec()</text>
    <text x="24" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">防止危险系统调用</text>
  </g>
  <g transform="translate(820, 140)">
    <rect x="0" y="0" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#1B2A4A"/>
    <text x="24" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">⏱️ 子进程超时</text>
    <text x="24" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Python 判题 3 秒硬上限</text>
    <text x="24" y="75" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">C++ Trace 3 秒硬上限</text>
    <text x="24" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">TLE 自动返回，不阻塞系统</text>
  </g>
  <g transform="translate(80, 285)">
    <rect x="0" y="0" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#2D7DD2"/>
    <text x="24" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">✂️ 输出截断保护</text>
    <text x="24" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">防止无限输出</text>
    <text x="24" y="75" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">控制输出长度上限</text>
  </g>
  <g transform="translate(450, 285)">
    <rect x="0" y="0" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#1B2A4A"/>
    <text x="24" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🚫 内容安全检测</text>
    <text x="24" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">敏感词 / 幻觉检测</text>
    <text x="24" y="75" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">题目编号真实性校验</text>
  </g>
  <g transform="translate(820, 285)">
    <rect x="0" y="0" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#2D7DD2"/>
    <text x="24" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🔐 Prompt 防护</text>
    <text x="24" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Prompt 注入检测</text>
    <text x="24" y="75" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">防止恶意指令绕过</text>
  </g>
  <!-- Summary bar -->
  <g transform="translate(80, 450)">
    <rect x="0" y="0" width="1120" height="60" rx="6" fill="#1B2A4A"/>
    <text x="560" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF" text-anchor="middle">六道安全防线 · 覆盖代码执行 + 内容生成 + 输出全链路</text>
    <text x="560" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#4A9FE5" text-anchor="middle">大模型生成内容仍可能存在错误，重要学术内容应由学生或教师进一步复核</text>
  </g>
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">17 / 24</text>
</svg>
