<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>

  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">01 · BACKGROUND</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">为什么现有方案不够？</text>
  <line x1="80" y1="100" x2="350" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- Comparison Table -->
  <g transform="translate(80, 140)">
    <!-- Table header -->
    <rect x="0" y="0" width="400" height="44" rx="4" fill="#1B2A4A"/>
    <rect x="410" y="0" width="500" height="44" rx="4" fill="#1B2A4A"/>
    <rect x="920" y="0" width="100" height="44" rx="4" fill="#1B2A4A"/>
    <text x="200" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF" text-anchor="middle">方案</text>
    <text x="660" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF" text-anchor="middle">核心不足</text>
    <text x="970" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF" text-anchor="middle">评价</text>

    <!-- Row 1: Traditional OJ -->
    <rect x="0" y="50" width="400" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="410" y="50" width="500" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="920" y="50" width="100" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <text x="24" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1E2024">传统 OJ（力扣/洛谷）</text>
    <text x="434" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="14" fill="#6B7280">只判对错，无诊断、无画像、无路径规划</text>
    <text x="970" y="80" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#EF4444" text-anchor="middle">✗</text>

    <!-- Row 2: MOOC -->
    <rect x="0" y="104" width="400" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="410" y="104" width="500" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="920" y="104" width="100" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <text x="24" y="134" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1E2024">MOOC 课程</text>
    <text x="434" y="134" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="14" fill="#6B7280">视频单向输出，无个性化、无交互式可视化</text>
    <text x="970" y="134" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#EF4444" text-anchor="middle">✗</text>

    <!-- Row 3: AI Assistants -->
    <rect x="0" y="158" width="400" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="410" y="158" width="500" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="920" y="158" width="100" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <text x="24" y="188" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1E2024">通用 AI 助手</text>
    <text x="434" y="188" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="14" fill="#6B7280">无课程知识库约束，易产生幻觉</text>
    <text x="970" y="188" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#EF4444" text-anchor="middle">△</text>

    <!-- Row 4: VisuAlgo -->
    <rect x="0" y="212" width="400" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="410" y="212" width="500" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <rect x="920" y="212" width="100" height="50" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
    <text x="24" y="242" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1E2024">算法可视化网站</text>
    <text x="434" y="242" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="14" fill="#6B7280">只能看预设动画，不能追踪自己写的代码</text>
    <text x="970" y="242" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#EF4444" text-anchor="middle">✗</text>

    <!-- Highlighted row: AlgoPilot -->
    <rect x="0" y="270" width="400" height="50" rx="4" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="2"/>
    <rect x="410" y="270" width="500" height="50" rx="4" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="2"/>
    <rect x="920" y="270" width="100" height="50" rx="4" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="2"/>
    <text x="24" y="300" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="700" font-size="15" fill="#1B2A4A">AlgoPilot（我们）</text>
    <text x="434" y="300" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">全流程智能闭环 — 画像+路径+资源+Trace+辅导</text>
    <text x="970" y="300" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#10B981" text-anchor="middle">◆</text>
  </g>

  <!-- Bottom message -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="720" height="60" rx="6" fill="none" stroke="#2D7DD2" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="20" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">💡 AlgoPilot 的解决思路</text>
    <text x="20" y="48" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="14" fill="#6B7280">多智能体协同 · RAG 知识库 · 大语言模型 · 代码 Trace 可视化    —  四大技术深度融合</text>
  </g>

  <!-- Page number -->
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">04 / 24</text>
</svg>
