<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>

  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">04 · CORE FEATURES</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">记你：动态学习路径 DAG</text>
  <line x1="80" y1="100" x2="400" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- DAG visualization -->
  <g transform="translate(80, 150)">
    <!-- Title -->
    <text x="0" y="0" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">知识点依赖关系 DAG</text>

    <!-- DAG Nodes -->
    <!-- Root: 数组 -->
    <rect x="400" y="30" width="120" height="36" rx="18" fill="#1B2A4A"/>
    <text x="460" y="53" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">数组</text>

    <!-- Level 2 -->
    <line x1="440" y1="66" x2="320" y2="116" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="480" y1="66" x2="480" y2="116" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="520" y1="66" x2="640" y2="116" stroke="#D1D5DB" stroke-width="1.5"/>

    <rect x="260" y="120" width="120" height="36" rx="18" fill="#EDF0F5" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="320" y="143" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">链表</text>

    <rect x="420" y="120" width="120" height="36" rx="18" fill="#EDF0F5" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="480" y="143" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">栈与队列</text>

    <rect x="580" y="120" width="120" height="36" rx="18" fill="#EDF0F5" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="640" y="143" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">哈希表</text>

    <!-- Level 3 -->
    <line x1="320" y1="156" x2="320" y2="186" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="480" y1="156" x2="480" y2="186" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="640" y1="156" x2="640" y2="186" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="320" y1="200" x2="480" y2="200" stroke="#D1D5DB" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="480" y1="200" x2="640" y2="200" stroke="#D1D5DB" stroke-width="0.5" stroke-dasharray="3,2"/>

    <rect x="260" y="200" width="120" height="36" rx="18" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="1.5"/>
    <text x="320" y="223" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">树与二叉树</text>

    <rect x="540" y="200" width="120" height="36" rx="18" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="1.5"/>
    <text x="600" y="223" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">排序算法</text>

    <!-- Level 4 -->
    <line x1="320" y1="236" x2="320" y2="280" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="600" y1="236" x2="600" y2="280" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="320" y1="280" x2="600" y2="280" stroke="#D1D5DB" stroke-width="0.5" stroke-dasharray="3,2"/>

    <rect x="250" y="290" width="140" height="36" rx="18" fill="#E8F0FE" stroke="#2D7DD2" stroke-width="1.5"/>
    <text x="320" y="313" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">图与图算法</text>

    <rect x="500" y="290" width="140" height="36" rx="18" fill="#E8F0FE" stroke="#2D7DD2" stroke-width="1.5"/>
    <text x="570" y="313" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">动态规划</text>

    <!-- Reinforcement node -->
    <line x1="570" y1="326" x2="570" y2="360" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="490" y="370" width="160" height="36" rx="18" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="570" y="393" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="11" fill="#EF4444" text-anchor="middle">⚠ 巩固：从树到图</text>
  </g>

  <!-- Feature highlights on the right -->
  <g transform="translate(800, 160)">
    <rect x="0" y="0" width="360" height="120" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="20" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">LearningPathAgent</text>
    <text x="20" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">✦ 基于画像生成个性化路径</text>
    <text x="20" y="75" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">✦ DAG 可视化，可拖动交互</text>
    <text x="20" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">✦ 受挫自动插入巩固节点</text>
    <text x="20" y="115" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">✦ 掌握度达阈值自动推进</text>
  </g>

  <!-- Page number -->
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">11 / 24</text>
</svg>
