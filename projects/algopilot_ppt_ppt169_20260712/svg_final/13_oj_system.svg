<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">04 · CORE FEATURES</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">纠你：在线 OJ + 代码诊断</text>
  <line x1="80" y1="100" x2="400" y2="100" stroke="#2D7DD2" stroke-width="2"/>
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="640" height="360" rx="6" fill="#1B2A4A"/>
    <text x="30" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF">OJ 代码编辑器界面</text>
    <rect x="20" y="55" width="600" height="40" rx="4" fill="#0F1D32"/>
    <text x="35" y="80" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#4A9FE5">▶ Run</text>
    <text x="95" y="80" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">|</text>
    <text x="115" y="80" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF">Python 3</text>
    <text x="195" y="80" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF">C++</text>
    <text x="530" y="80" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#10B981">● Trace</text>
    <!-- Code lines -->
    <text x="35" y="120" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">1</text>
    <text x="50" y="120" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">def reverse_list(head):</text>
    <text x="35" y="142" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">2</text>
    <text x="50" y="142" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">    prev = None</text>
    <text x="35" y="164" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">3</text>
    <text x="50" y="164" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">    curr = head</text>
    <text x="35" y="186" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">4</text>
    <text x="50" y="186" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">    while curr:</text>
    <text x="35" y="208" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">5</text>
    <text x="50" y="208" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#2D7DD2">        next_node = curr.next</text>
    <text x="35" y="230" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">6</text>
    <text x="50" y="230" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">        curr.next = prev</text>
    <text x="35" y="252" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">7</text>
    <text x="50" y="252" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">        prev = curr</text>
    <text x="35" y="274" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">8</text>
    <text x="50" y="274" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">        curr = next_node</text>
    <text x="35" y="296" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#E8E8E8" opacity="0.5">9</text>
    <text x="50" y="296" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="12" fill="#9CA3AF">    return prev</text>
    <!-- Result area -->
    <rect x="20" y="310" width="600" height="35" rx="4" fill="#0F1D32"/>
    <text x="35" y="333" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#10B981">✓ 测试通过 (3/3)  |  Trace 动画已生成</text>
  </g>
  <!-- Feature cards right -->
  <g transform="translate(750, 140)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="15" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🐍 Python 判题</text>
    <text x="15" y="52" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">subprocess 沙盒执行</text>
    <text x="15" y="70" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">3s 超时硬上限</text>
  </g>
  <g transform="translate(980, 140)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="15" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">⚡ C++ 判题</text>
    <text x="15" y="52" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">g++ 编译 + 运行</text>
    <text x="15" y="70" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">危险调用拦截</text>
  </g>
  <g transform="translate(750, 240)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="15" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🔍 AST 审计</text>
    <text x="15" y="52" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">死循环检测</text>
    <text x="15" y="70" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">数组越界检查</text>
  </g>
  <g transform="translate(980, 240)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="15" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🛡️ 安全机制</text>
    <text x="15" y="52" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">危险调用拦截</text>
    <text x="15" y="70" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">输出截断保护</text>
  </g>
  <!-- Bottom feature -->
  <g transform="translate(750, 350)">
    <rect x="0" y="0" width="430" height="80" rx="6" fill="#E8F0FE" stroke="#2D7DD2" stroke-width="1.5"/>
    <text x="20" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">🎯 AI 诊断分析</text>
    <text x="20" y="52" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">错误代码自动分析 + 优化建议 + 知识点关联</text>
    <text x="20" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">基于 RAG 知识库的上下文感知诊断</text>
  </g>
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">13 / 24</text>
</svg>
