    <rect x="0" y="0" width="6" height="90" rx="3" fill="#2D7DD2"/>
    <text x="24" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">06 开源与AI说明</text>
    <text x="24" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">第三方依赖、AI Coding 使用说明</text>
