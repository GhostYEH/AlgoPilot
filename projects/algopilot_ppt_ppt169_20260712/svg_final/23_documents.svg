    <line x1="20" y1="40" x2="1100" y2="40" stroke="#D1D5DB" stroke-width="1"/>
    <text x="20" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280">前端：Vue 3 + TypeScript + Element Plus | 后端：FastAPI + Python | AI：讯飞星火 + 自研DAG | 数据库：SQLAlchemy 2.0 + SQLite/MySQL | OJ：subprocess + GDB + AST</text>
