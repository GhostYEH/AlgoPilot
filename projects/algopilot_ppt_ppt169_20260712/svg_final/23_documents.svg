    <text x="24" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">01 项目说明书</text>
    <text x="24" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">项目背景、目标用户、创新价值、技术实现</text>
  </g>
  <g transform="translate(460, 150)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#2D7DD2"/>
    <text x="24" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">02 系统开发说明书</text>
    <text x="24" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">架构设计、分层职责、模块说明、目录结构</text>
  </g>
  <g transform="translate(840, 150)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#1B2A4A"/>
    <text x="24" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">03 测试说明书</text>
    <text x="24" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">测试策略、测试用例、执行结果、覆盖率</text>
  </g>
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#2D7DD2"/>
    <text x="24" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">04 部署说明书</text>
    <text x="24" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">部署架构、环境要求、启动方式、配置说明</text>
  </g>
  <g transform="translate(460, 270)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#1B2A4A"/>
    <text x="24" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1B2A4A">05 用户操作手册</text>
    <text x="24" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">功能说明、操作步骤、常见问题、系统截图</text>
  </g>
  <g transform="translate(840, 270)">
