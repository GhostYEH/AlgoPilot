<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>

  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">03 · ARCHITECTURE</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">四阶段并行生成，效率翻倍</text>
  <line x1="80" y1="100" x2="400" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- Phase Pipeline -->
  <g transform="translate(80, 150)">
    <!-- Phase 1 -->
    <rect x="0" y="0" width="220" height="160" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="35" rx="6" fill="#1B2A4A"/>
    <text x="110" y="23" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">Phase 1</text>
    <!-- Content -->
    <rect x="15" y="50" width="190" height="45" rx="4" fill="#E8F0FE"/>
    <text x="110" y="68" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">📄 document</text>
    <text x="110" y="88" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">ConceptAgent</text>
    <text x="110" y="130" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">串行入口</text>
    <text x="110" y="148" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#9CA3AF" text-anchor="middle">串行 →</text>

    <!-- Arrow -->
    <line x1="220" y1="80" x2="260" y2="80" stroke="#1B2A4A" stroke-width="2"/>
    <polygon points="260,80 250,73 250,87" fill="#1B2A4A"/>

    <!-- Phase 2 (Parallel) -->
    <g transform="translate(270, -20)">
      <rect x="0" y="0" width="220" height="95" rx="6" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="30" rx="6" fill="#2D7DD2"/>
      <text x="110" y="20" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">Phase 2 ⚡并行</text>
      <rect x="10" y="40" width="95" height="42" rx="4" fill="#EDF0F5"/>
      <text x="57" y="58" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">🧠 mindmap</text>
      <text x="57" y="74" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">GraphAgent</text>
      <rect x="115" y="40" width="95" height="42" rx="4" fill="#EDF0F5"/>
      <text x="162" y="58" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">📝 exercises</text>
      <text x="162" y="74" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">QuizAgent</text>
    </g>

    <!-- Phase 2 parallel lines down to Phase 3 -->
    <line x1="380" y1="140" x2="380" y2="180" stroke="#2D7DD2" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="380" y1="180" x2="540" y2="180" stroke="#2D7DD2" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="540" y1="180" x2="540" y2="200" stroke="#2D7DD2" stroke-width="1.5"/>
    <polygon points="540,200 534,190 546,190" fill="#2D7DD2"/>

    <!-- Phase 3 -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="220" height="95" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="30" rx="6" fill="#1B2A4A"/>
      <text x="110" y="20" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">Phase 3</text>
      <rect x="15" y="42" width="190" height="42" rx="4" fill="#E8F0FE"/>
      <text x="110" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">💻 code_case</text>
      <text x="110" y="77" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">ScenarioAgent</text>
    </g>

    <!-- Arrow -->
    <line x1="770" y1="47" x2="800" y2="47" stroke="#1B2A4A" stroke-width="2"/>
    <polygon points="800,47 790,40 790,54" fill="#1B2A4A"/>

    <!-- Phase 4 (Parallel) -->
    <g transform="translate(810, -20)">
      <rect x="0" y="0" width="220" height="95" rx="6" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="30" rx="6" fill="#2D7DD2"/>
      <text x="110" y="20" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">Phase 4 ⚡并行</text>
      <rect x="10" y="40" width="95" height="42" rx="4" fill="#EDF0F5"/>
      <text x="57" y="58" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">🎬 trace</text>
      <text x="57" y="74" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">TraceAgent</text>
      <rect x="115" y="40" width="95" height="42" rx="4" fill="#EDF0F5"/>
      <text x="162" y="58" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">📖 reading</text>
      <text x="162" y="74" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">ReadingAgent</text>
    </g>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="1120" height="90" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="20" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">⚡ 并行拓扑相比串行生成，效率提升 2-3 倍</text>
    <line x1="20" y1="42" x2="1100" y2="42" stroke="#EDF0F5" stroke-width="1"/>
    <text x="20" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Phase 2 的 mindmap 和 exercises 互不依赖，可并行生成</text>
    <text x="20" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Phase 4 的 trace_animation 和 reading 同样并行执行</text>
  </g>

  <!-- Tag -->
  <g transform="translate(920, 535)">
    <rect x="0" y="0" width="240" height="30" rx="15" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="1"/>
    <text x="120" y="20" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">✦ 6 种资源类型的协同工作流</text>
  </g>

  <!-- Page number -->
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">09 / 24</text>
</svg>
