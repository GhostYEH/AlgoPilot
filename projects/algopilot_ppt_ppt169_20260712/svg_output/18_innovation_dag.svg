<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="p18-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F7F8FA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1280" height="200" fill="url(#p18-grad)"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <g opacity="0.03">
    <circle cx="1100" cy="80" r="140" fill="#1B2A4A"/>
    <circle cx="80" cy="680" r="120" fill="#2D7DD2"/>
  </g>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">06 · INNOVATION</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">零依赖的自研 DAG 编排引擎</text>
  <line x1="80" y1="100" x2="450" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- Main flow diagram -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="640" height="410" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="640" height="40" rx="8" fill="#1B2A4A"/>
    <text x="20" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#FFFFFF">自研编排器流程</text>
    <!-- Pipeline -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="120" height="40" rx="6" fill="#1B2A4A"/>
      <text x="60" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">Pipeline</text>
      <line x1="120" y1="20" x2="150" y2="20" stroke="#1B2A4A" stroke-width="2"/>
      <polygon points="150,20 142,14 142,26" fill="#1B2A4A"/>
      <rect x="150" y="0" width="120" height="40" rx="6" fill="#2D7DD2"/>
      <text x="210" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">资源调度</text>
      <line x1="270" y1="20" x2="300" y2="20" stroke="#2D7DD2" stroke-width="2"/>
      <polygon points="300,20 292,14 292,26" fill="#2D7DD2"/>
      <rect x="300" y="0" width="140" height="40" rx="6" fill="#1B2A4A"/>
      <text x="370" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">并行执行器</text>
    </g>
    <!-- Branch diagram -->
    <g transform="translate(80, 140)">
      <line x1="60" y1="0" x2="60" y2="25" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="15" y1="25" x2="105" y2="25" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="15" y1="25" x2="15" y2="45" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="105" y1="25" x2="105" y2="45" stroke="#D1D5DB" stroke-width="1.5"/>
      <rect x="0" y="45" width="30" height="55" rx="4" fill="#EDF0F5" stroke="#D1D5DB" stroke-width="1"/>
      <text x="15" y="68" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">串行</text>
      <text x="15" y="82" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">节点</text>
      <rect x="75" y="45" width="30" height="55" rx="4" fill="#EDF0F5" stroke="#D1D5DB" stroke-width="1"/>
      <text x="90" y="68" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">并行</text>
      <text x="90" y="82" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="10" fill="#6B7280" text-anchor="middle">节点</text>
      <line x1="15" y1="100" x2="15" y2="115" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="105" y1="100" x2="105" y2="115" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="15" y1="115" x2="105" y2="115" stroke="#D1D5DB" stroke-width="1.5"/>
      <line x1="60" y1="115" x2="60" y2="130" stroke="#D1D5DB" stroke-width="1.5"/>
      <rect x="35" y="130" width="50" height="30" rx="15" fill="#10B981"/>
      <text x="60" y="150" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">Done</text>
    </g>
    <g transform="translate(40, 340)">
      <rect x="0" y="0" width="560" height="36" rx="6" fill="#EDF0F5"/>
      <text x="280" y="23" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280" text-anchor="middle">支持串行 / 并行 / 条件分支拓扑 · 188 测试验证编排正确性</text>
    </g>
  </g>

  <!-- Right: Key points -->
  <g transform="translate(760, 130)">
    <rect x="0" y="0" width="420" height="125" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="125" rx="2" fill="#2D7DD2"/>
    <circle cx="28" cy="28" r="16" fill="#2D7DD2"/>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">✦</text>
    <text x="56" y="33" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="600" font-size="16" fill="#1B2A4A">零 langgraph 依赖</text>
    <text x="20" y="65" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">借鉴状态图与 DAG 编排思想，自主实现</text>
    <text x="20" y="88" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">不依赖任何第三方 Agent 框架</text>
    <text x="20" y="110" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">部署简单，无额外运行时依赖</text>
  </g>
  <g transform="translate(760, 275)">
    <rect x="0" y="0" width="420" height="125" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="125" rx="2" fill="#1B2A4A"/>
    <circle cx="28" cy="28" r="16" fill="#1B2A4A"/>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">✦</text>
    <text x="56" y="33" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="600" font-size="16" fill="#1B2A4A">灵活拓扑编排</text>
    <text x="20" y="65" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">DAG 拓扑定义 Agent 依赖关系</text>
    <text x="20" y="88" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">四阶段并行资源生成</text>
    <text x="20" y="110" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">任务级调度精确到每个 Agent</text>
  </g>
  <g transform="translate(760, 420)">
    <rect x="0" y="0" width="420" height="125" rx="8" fill="#E8F0FE" stroke="#2D7DD2" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="125" rx="2" fill="#2D7DD2"/>
    <circle cx="28" cy="28" r="16" fill="#2D7DD2"/>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">✦</text>
    <text x="56" y="33" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="600" font-size="16" fill="#1B2A4A">188 测试通过</text>
    <text x="20" y="65" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">涵盖编排器核心逻辑</text>
    <text x="20" y="88" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Agent 调用链路测试</text>
    <text x="20" y="110" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">端到端流程验证</text>
  </g>

  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">18 / 24</text>
</svg>
