<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">06 · INNOVATION</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">更多技术创新</text>
  <line x1="80" y1="100" x2="350" y2="100" stroke="#2D7DD2" stroke-width="2"/>
  <!-- Three innovation cards -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="360" height="420" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="50" rx="6" fill="#1B2A4A"/>
    <text x="20" y="32" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#FFFFFF">创新三：四阶段并行</text>
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="320" height="45" rx="4" fill="#EDF0F5"/>
      <text x="160" y="18" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">document → (mindmap ∥ exercises)</text>
      <text x="160" y="36" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">→ code_case → (trace ∥ reading)</text>
      <line x1="0" y1="60" x2="320" y2="60" stroke="#D1D5DB" stroke-width="1"/>
      <text x="0" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">串行依赖 → 并行拓扑</text>
      <text x="0" y="100" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">效率提升 2-3 倍</text>
      <line x1="0" y1="115" x2="320" y2="115" stroke="#D1D5DB" stroke-width="1"/>
      <text x="0" y="138" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">技术细节</text>
      <text x="0" y="162" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Phase 2 的 mindmap 和 exercises</text>
      <text x="0" y="182" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">互不依赖，可并行生成</text>
      <text x="0" y="202" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Phase 4 的 trace 和 reading 同理</text>
      <text x="0" y="222" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">自研 DAG 调度确保拓扑正确性</text>
    </g>
  </g>
  <g transform="translate(460, 140)">
    <rect x="0" y="0" width="360" height="420" rx="6" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="50" rx="6" fill="#2D7DD2"/>
    <text x="20" y="32" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#FFFFFF">创新四：三重防幻觉</text>
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="320" height="45" rx="4" fill="#E8F0FE"/>
      <text x="160" y="18" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">BM25 约束 → 校验回流 → 安全审查</text>
      <text x="160" y="36" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">三层防线系统级降风险</text>
      <line x1="0" y1="60" x2="320" y2="60" stroke="#D1D5DB" stroke-width="1"/>
      <text x="0" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">第一层：Okapi BM25 知识约束</text>
      <text x="0" y="100" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">检索课程知识库约束生成范围</text>
      <line x1="0" y1="115" x2="320" y2="115" stroke="#D1D5DB" stroke-width="1"/>
      <text x="0" y="138" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">第二层：ContentVerifierAgent</text>
      <text x="0" y="158" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">对照知识库校验回流重试</text>
      <line x1="0" y1="173" x2="320" y2="173" stroke="#D1D5DB" stroke-width="1"/>
      <text x="0" y="196" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">第三层：SafetyAgent</text>
      <text x="0" y="218" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">敏感词 / 幻觉 / Prompt注入检测</text>
    </g>
  </g>
  <g transform="translate(840, 140)">
    <rect x="0" y="0" width="360" height="420" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="50" rx="6" fill="#10B981"/>
    <text x="20" y="32" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#FFFFFF">创新五：确定性旁白</text>
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="320" height="45" rx="4" fill="#F0FDF4"/>
      <text x="160" y="18" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">经典题目 → 无 LLM 依赖</text>
      <text x="160" y="36" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1B2A4A" text-anchor="middle">可复现 · 可验证</text>
      <line x1="0" y1="60" x2="320" y2="60" stroke="#D1D5DB" stroke-width="1"/>
      <text x="0" y="82" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">解决的问题</text>
      <text x="0" y="108" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">纯 LLM 旁白不可复现</text>
      <text x="0" y="128" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">每次生成结果不一致</text>
      <line x1="0" y1="145" x2="320" y2="145" stroke="#D1D5DB" stroke-width="1"/>
      <text x="0" y="168" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1B2A4A">技术方案</text>
      <text x="0" y="194" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">经典题目预定义旁白模板</text>
      <text x="0" y="214" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">基于代码执行状态映射</text>
      <text x="0" y="234" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">覆盖反转链表、unique-paths 等</text>
    </g>
  </g>
  <text x="1200" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">20 / 24</text>
</svg>
