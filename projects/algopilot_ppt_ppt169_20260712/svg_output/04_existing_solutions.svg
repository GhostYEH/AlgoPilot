  <!-- Bottom insight box -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="720" height="70" rx="8" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="0" y="0" width="4" height="70" rx="2" fill="#2D7DD2"/>
    <text x="20" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="15" fill="#1B2A4A">💡 AlgoPilot 的解决思路</text>
    <text x="20" y="54" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">多智能体协同 · RAG 知识库 · 大语言模型 · 代码 Trace 可视化    —  四大技术深度融合</text>
