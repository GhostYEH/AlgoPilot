    <rect x="10" y="15" width="40" height="50" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="70" y="15" width="40" height="50" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="30" y2="35" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="90" y1="30" x2="90" y2="45" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Table -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="380" height="42" rx="4" fill="#1B2A4A"/>
    <rect x="390" y="0" width="480" height="42" rx="4" fill="#1B2A4A"/>
    <rect x="880" y="0" width="100" height="42" rx="4" fill="#1B2A4A"/>
    <text x="190" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF" text-anchor="middle">方案</text>
    <text x="630" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF" text-anchor="middle">核心不足</text>
    <text x="930" y="26" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF" text-anchor="middle">评价</text>

