    <!-- Highlighted: AlgoPilot -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="380" height="48" rx="4" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="2"/>
      <rect x="390" y="0" width="480" height="48" rx="4" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="2"/>
      <rect x="880" y="0" width="100" height="48" rx="4" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="2"/>
