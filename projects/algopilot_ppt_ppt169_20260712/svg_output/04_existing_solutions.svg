      <text x="24" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#1B2A4A">AlgoPilot（我们）</text>
      <text x="414" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">全流程智能闭环 — 画像+路径+资源+Trace+辅导</text>
      <text x="930" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#10B981" text-anchor="middle">✓</text>
