      <rect x="390" y="0" width="480" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <rect x="880" y="0" width="100" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <text x="24" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1E2024">MOOC 课程</text>
      <text x="414" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">视频单向输出，无个性化、无交互式可视化</text>
      <text x="930" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#EF4444" text-anchor="middle">✗</text>
    </g>
    <g transform="translate(0, 152)">
      <rect x="0" y="0" width="380" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <rect x="390" y="0" width="480" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <rect x="880" y="0" width="100" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <text x="24" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1E2024">通用 AI 助手</text>
      <text x="414" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">无课程知识库约束，易产生幻觉</text>
      <text x="930" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#EF4444" text-anchor="middle">△</text>
    </g>
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="380" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <rect x="390" y="0" width="480" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <rect x="880" y="0" width="100" height="48" rx="2" fill="#FFFFFF" stroke="#EDF0F5" stroke-width="1"/>
      <text x="24" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1E2024">算法可视化网站</text>
      <text x="414" y="29" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">只能看预设动画，不能追踪自己写的代码</text>
      <text x="930" y="29" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#EF4444" text-anchor="middle">✗</text>
