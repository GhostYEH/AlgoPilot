  <!-- Highlight: 零 langgraph 依赖 -->
  <g transform="translate(880, 550)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#EDF0F5" stroke="#2D7DD2" stroke-width="1"/>
    <text x="140" y="23" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A" text-anchor="middle">✦ 自研轻量编排 · 零 langgraph 依赖</text>
