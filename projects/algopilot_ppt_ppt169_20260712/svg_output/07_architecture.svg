    <text x="70" y="55" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">前端</text>
    <text x="70" y="78" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#4A9FE5" text-anchor="middle">Frontend</text>
    <!-- Tech stack cards -->
    <g transform="translate(160, 20)">
