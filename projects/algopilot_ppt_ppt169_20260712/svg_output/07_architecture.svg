      <text x="10" y="22" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">Agent 层</text>
      <text x="10" y="42" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#6B7280">22 注册 · 20 已实现 · 6 Layer</text>
