      <text x="80" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1E2024" text-anchor="middle">Vue 3 + TypeScript</text>
      <text x="80" y="58" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">Element Plus · CodeMirror</text>
    </g>
    <g transform="translate(340, 20)">
      <rect x="0" y="0" width="160" height="80" rx="4" fill="#EDF0F5"/>
      <text x="80" y="35" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1E2024" text-anchor="middle">30+ 页面</text>
      <text x="80" y="58" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">70+ 组件 · 13 游戏</text>
    </g>
    <g transform="translate(520, 20)">
