    <g transform="translate(410, 12)">
      <rect x="0" y="0" width="230" height="55" rx="4" fill="#E8F0FE"/>
      <text x="10" y="22" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">RAG 知识层</text>
      <text x="10" y="42" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#6B7280">BM25 检索 · 同义词扩展 · 课程Markdown</text>
    </g>
    <g transform="translate(410, 73)">
      <rect x="0" y="0" width="230" height="55" rx="4" fill="#E8F0FE"/>
      <text x="10" y="22" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">OJ + 安全层</text>
      <text x="10" y="42" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#6B7280">Python/C++ · AST 审计 · 3s 超时</text>
    </g>
    <g transform="translate(660, 12)">
      <rect x="0" y="0" width="230" height="55" rx="4" fill="#E8F0FE"/>
      <text x="10" y="22" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">数据层</text>
      <text x="10" y="42" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#6B7280">SQLAlchemy 2.0 · 7 表 · SQLite/MySQL</text>
    </g>
    <g transform="translate(660, 73)">
      <rect x="0" y="0" width="230" height="55" rx="4" fill="#E8F0FE"/>
      <text x="10" y="22" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">LLM 层</text>
      <text x="10" y="42" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#6B7280">讯飞星火 · OpenAI 兼容 · 流式+非流式</text>
