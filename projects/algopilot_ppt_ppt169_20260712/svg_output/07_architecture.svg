      <text x="80" y="32" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#1E2024" text-anchor="middle">SSE 流式</text>
      <text x="80" y="54" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">AI 辅导实时输出</text>
