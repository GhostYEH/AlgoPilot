<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Left navy panel -->
  <rect x="0" y="0" width="640" height="720" fill="#1B2A4A"/>
  <!-- Right white panel -->
  <rect x="640" y="0" width="640" height="720" fill="#F7F8FA"/>
  <!-- Diagonal accent (a thin triangle wedge) -->
  <polygon points="626,0 654,0 654,720 626,720" fill="#2D7DD2" opacity="0.8"/>
  <!-- Content left -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="'Inter', 'Source Han Sans SC', sans-serif" font-weight="700" font-size="56" fill="#FFFFFF">Thank You</text>
    <text x="0" y="55" font-family="'Inter', 'Source Han Sans SC', sans-serif" font-weight="500" font-size="18" fill="#4A9FE5">AlgoPilot — 算法领航员</text>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#2D7DD2" stroke-width="2"/>
    <text x="0" y="120" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="16" fill="#9CA3AF">从不会到掌握</text>
    <text x="0" y="148" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="16" fill="#9CA3AF">AlgoPilot 陪每个学习者走过每一步</text>
  </g>
  <!-- Info bar -->
  <g transform="translate(80, 620)">
    <text x="0" y="0" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="14" fill="#6B7280">软件杯 A3 赛题 · 2026</text>
  </g>
  <!-- Right decorative -->
  <g transform="translate(980, 280)" opacity="0.08">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="0" cy="0" r="15" fill="#1B2A4A"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#1B2A4A" stroke-width="0.5"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#1B2A4A" stroke-width="0.5"/>
    <circle cx="85" cy="85" r="3" fill="#2D7DD2"/>
    <circle cx="-85" cy="85" r="3" fill="#2D7DD2"/>
    <circle cx="85" cy="-85" r="3" fill="#2D7DD2"/>
    <circle cx="-85" cy="-85" r="3" fill="#2D7DD2"/>
  </g>
  <text x="1200" y="685" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">24 / 24</text>
</svg>
