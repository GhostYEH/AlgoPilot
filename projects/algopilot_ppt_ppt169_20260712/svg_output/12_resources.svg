    <rect x="0" y="0" width="340" height="6" rx="3" fill="#1B2A4A"/>
    <g transform="translate(280, 15)" opacity="0.1">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#1B2A4A"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">✓</text>
