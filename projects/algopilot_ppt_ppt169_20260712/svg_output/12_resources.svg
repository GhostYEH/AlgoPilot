  <g transform="translate(840, 315)">
    <rect x="0" y="0" width="340" height="155" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" rx="3" fill="#2D7DD2"/>
    <g transform="translate(280, 15)" opacity="0.1">
      <rect x="0" y="0" width="35" height="45" rx="2" fill="#2D7DD2"/>
      <line x1="5" y1="10" x2="30" y2="10" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="5" y1="18" x2="25" y2="18" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="5" y1="26" x2="30" y2="26" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="5" y1="34" x2="20" y2="34" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
    <text x="20" y="38" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="18" fill="#1B2A4A">📖 分层拓展阅读</text>
    <line x1="20" y1="50" x2="320" y2="50" stroke="#EDF0F5" stroke-width="1"/>
    <text x="20" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">ReadingAgent</text>
    <text x="20" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">分层难度匹配</text>
    <text x="20" y="118" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">拓展知识边界</text>
  </g>

  <!-- Bottom learning chain -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="1120" height="40" rx="20" fill="#EDF0F5"/>
    <rect x="0" y="0" width="1120" height="40" rx="20" fill="none" stroke="#D1D5DB" stroke-width="1"/>
    <!-- Chain steps -->
    <text x="95" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">理解</text>
    <text x="280" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">→ 结构化</text>
    <text x="475" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">→ 练习</text>
    <text x="650" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">→ 实践</text>
    <text x="830" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">→ 调试</text>
    <text x="1020" y="25" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#6B7280" text-anchor="middle">→ 拓展</text>
  </g>

  <!-- Page number -->
  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">12 / 24</text>
