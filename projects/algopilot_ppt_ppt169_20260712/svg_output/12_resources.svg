  <g transform="translate(460, 315)">
    <rect x="0" y="0" width="340" height="155" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" rx="3" fill="#1B2A4A"/>
    <g transform="translate(280, 15)" opacity="0.1">
      <polygon points="20,5 35,20 20,35" fill="#1B2A4A"/>
      <rect x="0" y="10" width="12" height="3" rx="1" fill="#1B2A4A"/>
      <rect x="0" y="18" width="12" height="3" rx="1" fill="#1B2A4A"/>
      <rect x="0" y="26" width="12" height="3" rx="1" fill="#1B2A4A"/>
    </g>
    <text x="20" y="38" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="18" fill="#1B2A4A">🎬 Trace 执行动画</text>
    <line x1="20" y1="50" x2="320" y2="50" stroke="#EDF0F5" stroke-width="1"/>
    <text x="20" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">TraceAgent</text>
    <text x="20" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">13 种可视化类型</text>
    <text x="20" y="118" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">代码逐行追踪诊断</text>
  </g>
