<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="p12-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F7F8FA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1280" height="300" fill="url(#p12-grad)"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>

  <!-- Decorative pattern -->
  <g opacity="0.03">
    <circle cx="1200" cy="600" r="120" fill="#1B2A4A"/>
    <circle cx="80" cy="650" r="100" fill="#2D7DD2"/>
    <rect x="400" y="550" width="2" height="200" fill="#1B2A4A" transform="rotate(-30 400 550)"/>
  </g>

  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">04 · CORE FEATURES</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">陪你：六种覆盖全场景学习资源</text>
  <line x1="80" y1="100" x2="450" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- R1 C1: 讲解文档 -->
  <g transform="translate(80, 135)">
    <rect x="0" y="0" width="340" height="155" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" rx="3" fill="#1B2A4A"/>
    <!-- Decorative icon -->
    <g transform="translate(280, 15)" opacity="0.1">
      <rect x="0" y="0" width="40" height="50" rx="4" fill="#1B2A4A"/>
      <line x1="8" y1="15" x2="32" y2="15" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="8" y1="25" x2="32" y2="25" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="8" y1="35" x2="25" y2="35" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <text x="20" y="38" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="18" fill="#1B2A4A">📄 讲解文档</text>
    <line x1="20" y1="50" x2="320" y2="50" stroke="#EDF0F5" stroke-width="1"/>
    <text x="20" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">ConceptAgent</text>
    <text x="20" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">结合 RAG 知识库</text>
    <text x="20" y="118" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">个性化课程讲解</text>
  </g>
  <!-- R1 C2: 思维导图 -->
  <g transform="translate(460, 135)">
    <rect x="0" y="0" width="340" height="155" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" rx="3" fill="#2D7DD2"/>
    <g transform="translate(280, 15)" opacity="0.1">
      <circle cx="20" cy="15" r="15" fill="#2D7DD2"/>
      <circle cx="20" cy="15" r="5" fill="#FFFFFF"/>
      <line x1="35" y1="15" x2="50" y2="5" stroke="#2D7DD2" stroke-width="2"/>
      <line x1="35" y1="15" x2="50" y2="25" stroke="#2D7DD2" stroke-width="2"/>
    </g>
    <text x="20" y="38" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="18" fill="#1B2A4A">🧠 思维导图</text>
    <line x1="20" y1="50" x2="320" y2="50" stroke="#EDF0F5" stroke-width="1"/>
    <text x="20" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">GraphAgent</text>
    <text x="20" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Mermaid 格式</text>
    <text x="20" y="118" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">知识结构化可视化</text>
  </g>
