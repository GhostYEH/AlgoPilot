    <text x="20" y="38" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="18" fill="#1B2A4A">📝 分层练习题</text>
    <line x1="20" y1="50" x2="320" y2="50" stroke="#EDF0F5" stroke-width="1"/>
    <text x="20" y="72" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#1B2A4A">QuizAgent</text>
    <text x="20" y="95" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Bloom 认知分层</text>
    <text x="20" y="118" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">5 道个性化习题</text>
  </g>
  <!-- R2 C1: 代码实操 -->
  <g transform="translate(80, 315)">
    <rect x="0" y="0" width="340" height="155" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" rx="3" fill="#2D7DD2"/>
    <g transform="translate(280, 15)" opacity="0.1">
