  <g transform="translate(760, 335)">
    <rect x="0" y="0" width="420" height="50" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="20" cy="25" r="14" fill="#2D7DD2"/>
    <text x="20" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">✦</text>
