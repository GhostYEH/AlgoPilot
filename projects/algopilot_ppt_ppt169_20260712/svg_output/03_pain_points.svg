<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="p3-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2A4A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#2D7DD2" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#p3-grad)"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>

  <!-- Decorative background elements -->
  <g opacity="0.04">
    <circle cx="1100" cy="80" r="200" fill="#1B2A4A"/>
    <circle cx="1150" cy="650" r="150" fill="#2D7DD2"/>
    <rect x="900" y="300" width="3" height="400" fill="#1B2A4A" transform="rotate(-20 900 300)"/>
  </g>

  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">01 · BACKGROUND</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">每个算法学习者都懂的五道坎</text>
  <line x1="80" y1="100" x2="350" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- Decorative icon cluster top-right -->
  <g transform="translate(1080, 50)" opacity="0.12">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#1B2A4A"/>
    <rect x="50" y="0" width="40" height="40" rx="4" fill="#2D7DD2"/>
    <rect x="100" y="0" width="40" height="40" rx="4" fill="#1B2A4A"/>
    <rect x="25" y="50" width="40" height="40" rx="4" fill="#2D7DD2"/>
    <rect x="75" y="50" width="40" height="40" rx="4" fill="#1B2A4A"/>
  </g>

  <!-- P1 -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="340" height="100" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="28" cy="28" r="14" fill="#EF4444"/>
    <text x="28" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">P1</text>
    <text x="52" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">概念抽象难懂</text>
    <text x="20" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">树、图、动态规划高度抽象</text>
    <text x="20" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">课本静态插图难以展示动态过程</text>
    <!-- Decorative side bar -->
    <rect x="320" y="10" width="10" height="80" rx="5" fill="#EF4444" opacity="0.1"/>
  </g>
  <!-- P2 -->
  <g transform="translate(450, 140)">
    <rect x="0" y="0" width="340" height="100" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="28" cy="28" r="14" fill="#EF4444"/>
    <text x="28" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">P2</text>
    <text x="52" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">刷题盲目无方向</text>
    <text x="20" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">不知先学什么、后学什么</text>
    <text x="20" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">题海茫茫缺乏个性化路径</text>
    <rect x="320" y="10" width="10" height="80" rx="5" fill="#EF4444" opacity="0.1"/>
  </g>
  <!-- P3 -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="340" height="100" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="28" cy="28" r="14" fill="#EF4444"/>
    <text x="28" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">P3</text>
    <text x="52" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">错题不知为何错</text>
    <text x="20" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">OJ只返回WA/TLE冰冷判定</text>
    <text x="20" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">看不到程序运行轨迹</text>
    <rect x="320" y="10" width="10" height="80" rx="5" fill="#EF4444" opacity="0.1"/>
  </g>
  <!-- P4 -->
  <g transform="translate(450, 260)">
    <rect x="0" y="0" width="340" height="100" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="28" cy="28" r="14" fill="#EF4444"/>
    <text x="28" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">P4</text>
    <text x="52" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">学习过程无记录</text>
    <text x="20" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">学过的内容散落各处</text>
    <text x="20" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">换设备一切归零</text>
    <rect x="320" y="10" width="10" height="80" rx="5" fill="#EF4444" opacity="0.1"/>
  </g>
  <!-- P5 -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="340" height="100" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="28" cy="28" r="14" fill="#EF4444"/>
    <text x="28" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">P5</text>
    <text x="52" y="30" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="16" fill="#1E2024">教师难以因材施教</text>
    <text x="20" y="60" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">大班授课无法掌握个体差异</text>
    <text x="20" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">作业批改与学情分析靠人工</text>
    <rect x="320" y="10" width="10" height="80" rx="5" fill="#EF4444" opacity="0.1"/>
  </g>

  <!-- Right decorative panel: illustration -->
  <g transform="translate(840, 140)">
    <!-- Decorative figure thinking -->
    <circle cx="80" cy="60" r="25" fill="none" stroke="#1B2A4A" stroke-width="1.5" opacity="0.2"/>
    <line x1="80" y1="85" x2="80" y2="130" stroke="#1B2A4A" stroke-width="1.5" opacity="0.2"/>
    <line x1="60" y1="105" x2="100" y2="105" stroke="#1B2A4A" stroke-width="1.5" opacity="0.2"/>
    <!-- Question marks floating -->
    <text x="120" y="40" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#EF4444" opacity="0.15">?</text>
    <text x="30" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#EF4444" opacity="0.1">?</text>
    <text x="140" y="90" font-family="'Inter', sans-serif" font-weight="700" font-size="36" fill="#EF4444" opacity="0.1">?</text>
    <!-- AI brain icon -->
    <g transform="translate(0, 200)" opacity="0.08">
      <circle cx="80" cy="0" r="60" fill="none" stroke="#1B2A4A" stroke-width="1"/>
      <circle cx="80" cy="0" r="40" fill="none" stroke="#1B2A4A" stroke-width="1"/>
      <circle cx="80" cy="0" r="20" fill="none" stroke="#1B2A4A" stroke-width="1"/>
      <line x1="20" y1="0" x2="140" y2="0" stroke="#1B2A4A" stroke-width="0.5"/>
      <line x1="60" y1="-40" x2="60" y2="40" stroke="#1B2A4A" stroke-width="0.5"/>
      <line x1="100" y1="-40" x2="100" y2="40" stroke="#1B2A4A" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Callout -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="710" height="44" rx="6" fill="#EDF0F5"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#2D7DD2"/>
    <text x="20" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="15" fill="#6B7280">✦ 公认"最难啃的硬骨头" — 各大高校计算机专业课程调研</text>
  </g>

  <!-- Decorative bottom bar -->
  <rect x="80" y="580" width="1120" height="1" fill="#D1D5DB" opacity="0.5"/>
  <circle cx="80" cy="580" r="3" fill="#2D7DD2"/>
  <circle cx="1200" cy="580" r="3" fill="#2D7DD2"/>

  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">03 / 24</text>
</svg>
