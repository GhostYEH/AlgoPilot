<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#EDF0F5"/>
    </linearGradient>
    <linearGradient id="navy-block" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#233555"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle gradient -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#cover-bg)"/>

  <!-- Top decorative geometric pattern -->
  <g opacity="0.05">
    <circle cx="200" cy="80" r="60" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="350" cy="120" r="40" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="500" cy="60" r="50" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="650" cy="100" r="35" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="800" cy="50" r="55" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="950" cy="90" r="45" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    <circle cx="1100" cy="70" r="50" fill="none" stroke="#1B2A4A" stroke-width="1"/>
  </g>

  <!-- Interconnected node network (upper area) -->
  <g opacity="0.08">
    <!-- Nodes -->
    <circle cx="150" cy="160" r="6" fill="#1B2A4A"/>
    <circle cx="280" cy="100" r="8" fill="#1B2A4A"/>
    <circle cx="450" cy="180" r="5" fill="#1B2A4A"/>
    <circle cx="600" cy="90" r="7" fill="#1B2A4A"/>
    <circle cx="750" cy="170" r="5" fill="#1B2A4A"/>
    <circle cx="900" cy="80" r="8" fill="#1B2A4A"/>
    <circle cx="1050" cy="160" r="5" fill="#1B2A4A"/>
    <circle cx="1150" cy="100" r="6" fill="#1B2A4A"/>
    <!-- Edge nodes -->
    <circle cx="220" cy="220" r="4" fill="#2D7DD2"/>
    <circle cx="400" cy="260" r="5" fill="#2D7DD2"/>
    <circle cx="680" cy="240" r="4" fill="#2D7DD2"/>
    <circle cx="980" cy="250" r="5" fill="#2D7DD2"/>
    <!-- Connections -->
    <line x1="150" y1="160" x2="280" y2="100" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="280" y1="100" x2="450" y2="180" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="280" y1="100" x2="600" y2="90" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="450" y1="180" x2="220" y2="220" stroke="#2D7DD2" stroke-width="1"/>
    <line x1="600" y1="90" x2="750" y2="170" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="600" y1="90" x2="900" y2="80" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="750" y1="170" x2="680" y2="240" stroke="#2D7DD2" stroke-width="1"/>
    <line x1="900" y1="80" x2="1050" y2="160" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="900" y1="80" x2="1150" y2="100" stroke="#1B2A4A" stroke-width="1.5"/>
    <line x1="1050" y1="160" x2="980" y2="250" stroke="#2D7DD2" stroke-width="1"/>
    <line x1="450" y1="180" x2="400" y2="260" stroke="#2D7DD2" stroke-width="1"/>
  </g>

  <!-- Navy diagonal block -->
  <polygon points="0,420 1280,300 1280,720 0,720" fill="url(#navy-block)"/>

  <!-- Accent line at transition -->
  <line x1="0" y1="418" x2="1280" y2="298" stroke="#2D7DD2" stroke-width="3"/>
  <!-- Small accent dots along the line -->
  <circle cx="320" cy="378" r="3" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="640" cy="338" r="3" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="960" cy="298" r="3" fill="#FFFFFF" opacity="0.3"/>

  <!-- Decorative accent block -->
  <rect x="80" y="340" width="50" height="4" rx="2" fill="#2D7DD2"/>

  <!-- Main title -->
  <text x="80" y="475" font-family="'Inter', sans-serif" font-weight="700" font-size="56" fill="#FFFFFF" letter-spacing="1">AlgoPilot</text>
  <text x="80" y="540" font-family="'Source Han Sans SC', sans-serif" font-weight="700" font-size="52" fill="#FFFFFF">算法领航员</text>

  <!-- Subtitle with accent dot -->
  <circle cx="74" cy="592" r="4" fill="#2D7DD2"/>
  <text x="90" y="598" font-family="'Source Han Sans SC', sans-serif" font-weight="500" font-size="22" fill="#9CA3AF">面向《数据结构与算法》的多智能体智能学习平台</text>

  <!-- Tech tag -->
  <g transform="translate(80, 640)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#2D7DD2" opacity="0.2"/>
    <text x="80" y="19" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#4A9FE5" text-anchor="middle">Multi-Agent · RAG · LLM</text>
  </g>

  <!-- Bottom info -->
  <text x="1050" y="685" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#6B7280" text-anchor="end">软件杯 A3 赛题 · 2026</text>

  <!-- Subtle bottom bar -->
  <rect x="0" y="710" width="1280" height="10" fill="#2D7DD2" opacity="0.3"/>
</svg>
