<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="p9-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F7F8FA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1280" height="200" fill="url(#p9-grad)"/>
  <rect x="0" y="0" width="6" height="720" fill="#1B2A4A"/>
  <g opacity="0.03">
    <circle cx="150" cy="650" r="140" fill="#1B2A4A"/>
    <circle cx="1150" cy="80" r="100" fill="#2D7DD2"/>
  </g>
  <text x="80" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#2D7DD2" letter-spacing="3">03 · ARCHITECTURE</text>
  <text x="80" y="85" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="28" fill="#1B2A4A">四阶段并行生成，效率翻倍</text>
  <line x1="80" y1="100" x2="400" y2="100" stroke="#2D7DD2" stroke-width="2"/>

  <!-- Pipeline Flow -->
  <g transform="translate(80, 140)">
    <!-- Phase 1 -->
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="38" rx="8" fill="#1B2A4A"/>
    <circle cx="24" cy="19" r="10" fill="#2D7DD2"/>
    <text x="24" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="45" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF">Phase 1</text>
    <rect x="20" y="52" width="160" height="50" rx="6" fill="#E8F0FE"/>
    <text x="100" y="74" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="600" font-size="14" fill="#1B2A4A" text-anchor="middle">📄 document</text>
    <text x="100" y="94" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#6B7280" text-anchor="middle">ConceptAgent</text>
    <text x="100" y="132" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="middle">串行入口 →</text>

    <!-- Arrow 1→2 -->
    <line x1="200" y1="75" x2="235" y2="75" stroke="#1B2A4A" stroke-width="2"/>
    <polygon points="235,75 227,69 227,81" fill="#1B2A4A"/>

    <!-- Phase 2 Parallel -->
    <g transform="translate(245, -20)">
      <rect x="0" y="0" width="200" height="95" rx="8" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="35" rx="8" fill="#2D7DD2"/>
      <text x="100" y="23" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">Phase 2 ⚡</text>
      <rect x="10" y="46" width="85" height="38" rx="4" fill="#EDF0F5"/>
      <text x="52" y="66" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">🧠 mindmap</text>
      <text x="52" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">GraphAgent</text>
      <rect x="105" y="46" width="85" height="38" rx="4" fill="#EDF0F5"/>
      <text x="147" y="66" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">📝 exercises</text>
      <text x="147" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">QuizAgent</text>
    </g>

    <!-- Phase 2→3 connection -->
    <line x1="345" y1="135" x2="345" y2="165" stroke="#2D7DD2" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="345" y1="165" x2="485" y2="165" stroke="#2D7DD2" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="485" y1="165" x2="485" y2="85" stroke="#2D7DD2" stroke-width="1"/>
    <polygon points="485,85 479,93 491,93" fill="#2D7DD2"/>

    <!-- Phase 3 -->
    <g transform="translate(495, 0)">
      <rect x="0" y="0" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="38" rx="8" fill="#1B2A4A"/>
      <circle cx="24" cy="19" r="10" fill="#2D7DD2"/>
      <text x="24" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="45" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF">Phase 3</text>
      <rect x="20" y="52" width="160" height="50" rx="6" fill="#E8F0FE"/>
      <text x="100" y="74" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="600" font-size="14" fill="#1B2A4A" text-anchor="middle">💻 code_case</text>
      <text x="100" y="94" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="11" fill="#6B7280" text-anchor="middle">ScenarioAgent</text>
      <text x="100" y="132" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="middle">串行 →</text>
    </g>

    <!-- Arrow 3→4 -->
    <line x1="695" y1="75" x2="720" y2="75" stroke="#1B2A4A" stroke-width="2"/>
    <polygon points="720,75 712,69 712,81" fill="#1B2A4A"/>

    <!-- Phase 4 Parallel -->
    <g transform="translate(730, -20)">
      <rect x="0" y="0" width="200" height="95" rx="8" fill="#FFFFFF" stroke="#2D7DD2" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="35" rx="8" fill="#2D7DD2"/>
      <text x="100" y="23" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">Phase 4 ⚡</text>
      <rect x="10" y="46" width="85" height="38" rx="4" fill="#EDF0F5"/>
      <text x="52" y="66" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">🎬 trace</text>
      <text x="52" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">TraceAgent</text>
      <rect x="105" y="46" width="85" height="38" rx="4" fill="#EDF0F5"/>
      <text x="147" y="66" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#1E2024" text-anchor="middle">📖 reading</text>
      <text x="147" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="9" fill="#6B7280" text-anchor="middle">ReadingAgent</text>
    </g>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(80, 450)">
    <rect x="0" y="0" width="1120" height="90" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#2D7DD2"/>
    <text x="20" y="28" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="600" font-size="15" fill="#1B2A4A">⚡ 并行拓扑相比串行生成，效率提升 2-3 倍</text>
    <line x1="20" y1="42" x2="1100" y2="42" stroke="#EDF0F5" stroke-width="1"/>
    <text x="20" y="62" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Phase 2 的 mindmap 和 exercises 互不依赖，可并行生成</text>
    <text x="20" y="80" font-family="'Source Han Sans SC', 'Inter', sans-serif" font-weight="400" font-size="13" fill="#6B7280">Phase 4 的 trace_animation 和 reading 同样并行执行</text>
  </g>

  <text x="1240" y="700" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#9CA3AF" text-anchor="end">09 / 24</text>
</svg>
