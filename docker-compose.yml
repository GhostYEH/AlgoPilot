# AlgoPilot 一键演示栈（评委 / 现场演示）
# 用法：docker compose up --build
# 前端 http://localhost:8080  后端 http://localhost:9000/api/health

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-docker-demo-jwt-secret-change-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/alp_learning.db}
      SPARK_API_PASSWORD: ${SPARK_API_PASSWORD:-}
      SPARK_MODEL: ${SPARK_MODEL:-lite}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
