name: Frontend Checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'

jobs:
  verify:
    name: Typecheck, Build and Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:oj-struggle
      - run: npm run test:path-replan-diff
      - run: npm run test:graph-module
      - run: npm run test:structured-json
      - run: npm run test:exec-evidence
